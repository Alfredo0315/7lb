name: Information
on:
  push: 
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: author
        run: echo "Автор репозитория ${{ github.repository_owner }}"
      - name: repository
        run: echo "Репозиторий ${{ github.repository }}"
      - name: event
        run: echo "Запущен ${{ github.event_name }}"