name: Build artifacts
on: 
  push:
    branches: [ main ]
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'
        - name: Build prj
          run: dotnet build src/Calculator.ConsoleApp/Calculator.ConsoleApp.csproj --configuration Release
     
    test:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'
        - name: Run tests
          run: dotnet test tests/Calculator.Tests/Calculator.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage
        - name: code-coverage
          uses: actions/upload-artifact@v4
          with:
            name: code-coverage
            path: coverage