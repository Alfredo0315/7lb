name: Build and Tests with Debug and Release Parallel
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
     matrix:
      configuration: [Debug, Release]
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'
        - name: Run tests
          run: dotnet test tests/Calculator.Tests/Calculator.Tests.csproj --configuration ${{ matrix.configuration }}