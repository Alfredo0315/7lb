name: Build artifacts
on: [pull_request]
jobs:
    build:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          configuration: [Debug, Release]
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'
        - name: Build prj
          run: dotnet build src/Calculator.ConsoleApp/Calculator.ConsoleApp.csproj --configuration ${{ matrix.configuration }}
        - name:  Upload artifacts
          uses: actions/upload-artifact@v4
          with: 
            name: prj-${{ matrix.configuration }}
            path: src/Calculator.ConsoleApp/bin/${{ matrix.configuration }}/net8.0/
     
    test:
      needs: build
      runs-on: ubuntu-latest
      strategy:
        matrix:
          configuration: [Debug, Release]
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'
        - name: Run tests
          run: dotnet test tests/Calculator.Tests/Calculator.Tests.csproj --configuration ${{ matrix.configuration}}